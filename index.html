<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101214" />
  <meta name="description" content="MX Notes — a calm, connected space for writing and thinking." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;450;500;550;600;650;700&family=IBM+Plex+Mono:wght@400;450;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <title>MX Note</title>
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10z"/><path d="M13 3v7h7"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3.1 6.4 7.1 1-5.1 5 1.2 7.1L12 18.1l-6.3 3.4 1.2-7.1-5.1-5 7.1-1z"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="m10.8 7-4.5 9.5M13.2 7l4.5 9.5M8 19h8"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M20 17a4 4 0 0 0-.5-8A7 7 0 0 0 6 10a4 4 0 0 0 0 8h13"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 17-.5 4 4-.5L20 8l-4-4L4 17zM14 6l4 4"/></symbol>
    <symbol id="i-compose" viewBox="0 0 24 24"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7"/><path d="m10 14 9.2-9.2a2 2 0 0 1 2.8 2.8L12.8 16.8 9 17.8z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V4m-5 5 5-5 5 5M4 17v4h16v-4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h2M3 12h2M3 18h2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 11h18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1.5a2.5 2.5 0 0 0 1.7-4.3c-.7-.7-.2-1.7.7-1.7h2.6A3.5 3.5 0 0 0 22 11.5 9 9 0 0 0 12 3Z"/><circle cx="7.4" cy="11.4" r=".65" fill="currentColor" stroke="none"/><circle cx="10.5" cy="7.5" r=".65" fill="currentColor" stroke="none"/><circle cx="15.4" cy="8.3" r=".65" fill="currentColor" stroke="none"/><circle cx="6.9" cy="15.5" r=".65" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.3 8.5 8 11 4.7-2.5 8-6 8-11V5z"/><path d="m8 12 3 3 5-6"/></symbol>
  </svg>
  <div class="app-shell" id="shell">
    <section class="ios-folders-screen" id="ios-folders-screen" aria-label="Folders" hidden>
      <div class="ios-folders-top">
        <div class="ios-top-actions">
          <button id="ios-settings" class="ios-round-action ios-settings-trigger" type="button" aria-label="Settings" title="Settings"><svg><use href="#i-settings"/></svg></button>
          <button id="ios-add-folder" class="ios-round-action" type="button" aria-label="New folder" title="New folder"><svg><use href="#i-folder"/></svg><span class="ios-add-plus">+</span></button>
          <button id="ios-edit-folders" class="ios-pill-action" type="button" aria-pressed="false">Edit</button>
        </div>
        <h1>Folders</h1>
      </div>
      <div class="ios-folders-scroll" id="ios-folders-scroll">
        <h2>MX Cloud</h2>
        <div class="ios-folder-group" id="ios-folder-groups"></div>
        <div id="ios-pinned-section" class="ios-pinned-section" hidden></div>
      </div>
    </section>
    <section class="ios-notes-screen" id="ios-notes-screen" aria-label="Notes list" hidden>
      <div class="ios-list-top">
        <button id="ios-back-folders" class="ios-back-button" type="button" aria-label="Back to folders"><svg><use href="#i-arrow"/></svg><span>Folders</span></button>
        <button id="ios-list-more" class="ios-round-action" type="button" aria-label="Folder actions"><svg><use href="#i-more"/></svg></button>
      </div>
      <div class="ios-notes-scroll" id="ios-notes-scroll">
        <h1 id="ios-list-title" dir="auto">Notes</h1>
        <p id="ios-list-count">0 Notes</p>
        <div id="ios-notes-groups"></div>
      </div>
    </section>
    <aside class="sidebar" id="sidebar" aria-label="Notes navigation">
      <div class="sidebar-head"><button class="icon-button sidebar-close" id="close-sidebar" aria-label="Close navigation"><svg><use href="#i-x"/></svg></button></div>
      <div class="search-wrap"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search notes..." aria-label="Search notes"/><kbd>⌘K</kbd></div>
      <button class="create-note create-folder" id="new-folder"><svg><use href="#i-folder"/></svg> New folder <svg class="create-trailing"><use href="#i-plus"/></svg></button>
      <button class="create-note" id="new-note"><svg><use href="#i-plus"/></svg> New note <svg class="create-trailing"><use href="#i-edit"/></svg></button>
      <div class="side-scroll" id="side-scroll">
        <div id="quick-links" aria-label="All Notes and Favorites"></div>
        <div class="section-heading notes-heading"><button id="toggle-notes-list" data-drop-folder="Inbox" class="section-collapse" type="button" aria-expanded="true" title="Collapse / expand Notes folder"><svg><use href="#i-chevron"/></svg><svg class="notes-folder-icon"><use href="#i-folder"/></svg><span>Notes</span></button><span id="notes-total" class="tiny-count"></span></div>
        <div id="note-list" aria-label="Notes and folders"></div>
        <div class="section-heading pinned-heading" id="pinned-drop-area" title="Drag a folder here to pin"><span>Pinned Folders</span></div>
        <div id="folder-list" aria-label="Pinned shortcuts"></div>
      </div>
      <div class="sidebar-foot"><button id="trash-link" class="quick-link trash-bottom" type="button" aria-label="Trash"><svg><use href="#i-trash"/></svg><span>Trash</span><span id="trash-count" class="count"></span></button></div>
    </aside>
    <section class="desktop-notes-panel" id="desktop-notes-panel" aria-label="Notes list">
      <div class="desktop-notes-search">
        <svg><use href="#i-search"/></svg>
        <input id="desktop-note-search" type="search" aria-label="Search all notes" placeholder="Search all notes" />
      </div>
      <div class="desktop-notes-header">
        <h2 id="desktop-folder-label">All Notes</h2>
        <button class="desktop-list-add" id="desktop-compose" type="button" title="New note" aria-label="New note"><svg><use href="#i-edit"/></svg></button>
      </div>
      <div class="desktop-notes-scroll" id="desktop-notes-scroll"><div id="desktop-notes-items"></div></div>
      <div class="desktop-notes-footer"><button id="desktop-new-folder" type="button"><svg><use href="#i-plus"/></svg> New Folder</button></div>
    </section>
    <main class="editor-pane" id="editor-pane">
      <div class="tabbar desktop-tabbar"><div id="open-tabs" class="open-tabs" role="tablist" aria-label="Open notes"></div><button class="new-tab" id="tab-new" title="Open new note tab" aria-label="New tab"><svg><use href="#i-plus"/></svg></button></div>
      <div class="editor-toolbar">
        <button class="icon-button mobile-menu" id="open-sidebar" aria-label="Back to notes"><svg><use href="#i-arrow"/></svg></button>
        <button class="mobile-note-title" id="mobile-title">A calmer mind <svg><use href="#i-chevron"/></svg></button>
        <span class="desktop-breadcrumb" id="breadcrumb">Life <span> / </span> A calmer mind</span>
        <div class="toolbar-spacer"></div>
        <button class="sync-button" id="cloud-button" title="Cloud sync settings"><svg><use href="#i-cloud"/></svg><span id="sync-text">Saved locally</span><span class="toolbar-time" id="sync-time"></span></button>
        <button class="icon-button" id="theme-toggle" aria-label="Switch to light theme" title="Switch to light theme" aria-pressed="false"><svg><use href="#i-sun"/></svg></button>
        <button class="icon-button" id="focus-button" aria-label="Focus mode" title="Focus mode"><svg><use href="#i-maximize"/></svg></button>
        <button class="icon-button" id="more-button" aria-label="Note actions" title="Note actions"><svg><use href="#i-more"/></svg></button>
      </div>
      <div class="editor-scroll" id="editor-scroll">
        <div class="editor-content">
          <input id="note-title" class="note-title-input" dir="auto" aria-hidden="true" tabindex="-1" autocomplete="off" />
          <div id="rich-editor" class="rich-editor" dir="auto" contenteditable="true" role="textbox" aria-label="Note content; first line is the title" aria-multiline="true" spellcheck="true"></div>
          <div class="editor-bottom-space"></div>
        </div>
        <section class="folder-view" id="folder-view" hidden aria-label="Folder notes"></section>
      </div>
      <div class="writing-controls" id="writing-controls" role="toolbar" aria-label="Text formatting">
        <button id="style-picker" class="format-btn format-style" type="button" title="Text styles" aria-label="Text styles"><span class="style-symbol">Aa</span><svg><use href="#i-chevron"/></svg></button>
        <span class="format-divider"></span>
        <button class="format-btn strong" data-command="bold" title="Bold" aria-label="Bold"><strong>B</strong></button>
        <button class="format-btn italic" data-command="italic" title="Italic" aria-label="Italic"><em>I</em></button>
        <button class="format-btn" data-command="underline" title="Underline" aria-label="Underline"><u>U</u></button>
        <span class="format-divider"></span>
        <button class="format-btn" data-command="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list"><svg><use href="#i-list"/></svg></button>
        <button class="format-btn list-number" data-command="insertOrderedList" title="Numbered list" aria-label="Numbered list">1.</button>
        <button class="format-btn" data-command="checklist" title="Checklist" aria-label="Checklist"><svg><use href="#i-check"/></svg></button>
        <button class="format-btn" data-command="createLink" title="Insert link" aria-label="Insert link"><svg><use href="#i-link"/></svg></button>
        <span class="format-divider"></span>
        <button type="button" class="format-btn extra-tool" id="attach-file" title="Attach image, PDF or file" aria-label="Attach file">📎</button>
        <input id="attachment-input" type="file" multiple hidden accept="image/*,.pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,.zip,.json,.js,.py,.html,.css,.md,*/*" />
        <button type="button" class="format-btn extra-tool" id="insert-table" title="Insert editable table" aria-label="Insert table"><svg><use href="#i-list"/></svg><span class="tool-mini-grid">▦</span></button>
        <button type="button" class="format-btn extra-tool code-tool" id="insert-code" title="Insert syntax-highlighted code block" aria-label="Insert code block">&lt;/&gt;</button>
        <span class="format-divider"></span>
        <button class="format-btn paint-button paint-ink" id="text-color-picker" type="button" title="Text color · 10 colors" aria-label="Text color" aria-expanded="false"><span class="paint-letter">A</span><span class="paint-underline"></span></button>
        <button class="format-btn paint-button paint-marker" id="highlight-picker" type="button" title="Highlight · 10 colors" aria-label="Highlight text" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 18 3.1-3.1m1.2-1.2 7.9-7.9a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8l-7.9 7.9-3.2 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 21h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="marker-underline"></span></button>
        <span class="format-divider"></span>
        <label class="toolbar-select-wrap" for="writing-font"><span class="sr-only">Writing font</span><select id="writing-font" title="Writing font" aria-label="Writing font">
          <option value="system">System</option><option value="obsidian">Inter</option>
          <option value="arial">Arial</option><option value="calibri">Calibri</option>
          <option value="reading">Georgia</option><option value="times">Times New Roman</option>
          <option value="courier">Courier New</option><option value="mono">IBM Plex Mono</option>
          <option value="cairo">Cairo عربي</option><option value="naskh">Noto Naskh عربي</option>
        </select></label>
        <div class="text-size-controls" role="group" aria-label="Writing text size">
          <button id="font-size-down" class="format-btn size-step" type="button" aria-label="Decrease text size" title="Decrease text size">A−</button>
          <span id="font-size-label" aria-live="polite" title="Current writing text size">16</span>
          <button id="font-size-up" class="format-btn size-step" type="button" aria-label="Increase text size" title="Increase text size">A+</button>
        </div>
        <div class="writing-spacer"></div>
      </div>
      <footer class="editor-footer"><span id="word-count">0 words</span><span class="footer-separator">•</span><span id="character-count">0 characters</span><span class="footer-spacer"></span><span id="format-label">Rich text · Autosaved</span><span class="footer-separator">•</span><span class="footer-aa">Aa</span></footer>
    </main>
    <div class="ios-bottom-dock" id="ios-bottom-dock" hidden>
      <label class="ios-search-pill"><svg><use href="#i-search"/></svg><input id="ios-search" type="search" placeholder="Search" autocomplete="off" aria-label="Search all notes"/></label>
      <button class="ios-compose" id="ios-compose" type="button" title="New note" aria-label="Create a note"><svg><use href="#i-compose"/></svg></button>
    </div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="mobile-nav-btn active" data-mobile="notes" aria-label="Notes"><svg><use href="#i-file"/></svg><span>Notes</span></button>
      <button class="mobile-nav-btn" data-mobile="star" aria-label="Favorites"><svg><use href="#i-star"/></svg><span>Favorites</span></button>
      <button class="mobile-nav-btn" data-mobile="search" aria-label="Search"><svg><use href="#i-search"/></svg><span>Search</span></button>
      <button class="mobile-nav-btn" data-mobile="settings" aria-label="Settings"><svg><use href="#i-palette"/></svg><span>Settings</span></button>
      <button id="mobile-new" class="mobile-nav-btn mobile-create" aria-label="New note"><svg><use href="#i-plus"/></svg><span>New</span></button>
    </nav>
  </div>
  <div class="overlay" id="overlay" hidden></div>
  <div class="menu-popover" id="context-menu" role="menu" hidden></div>
  <div class="paint-popover" id="paint-menu" role="group" aria-label="Writing colors" hidden></div>
  <div class="menu-popover style-popover" id="style-menu" hidden>
    <button data-style="p" role="menuitem">Body text</button>
    <button data-style="h1" role="menuitem">Title</button>
    <button data-style="h2" role="menuitem">Heading</button>
    <button data-style="h3" role="menuitem">Subheading</button>
    <button data-style="blockquote" role="menuitem">Quote</button>
  </div>
  <dialog class="modal" id="settings-modal" aria-labelledby="settings-title">
    <div class="modal-head"><div><span class="modal-kicker">MX NOTE</span><h2 id="settings-title">Settings</h2></div><button class="icon-button" id="settings-close" aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
    <section class="sync-verification" aria-label="Cloud sync verification">
      <div class="verify-header"><span>Cloud sync</span></div>
      <div class="verify-line"><span>Connection</span><strong id="sync-connection">Local only</strong></div>
      <div class="verify-line"><span>Last confirmed cloud sync</span><strong id="last-sync-confirmed">Never</strong></div>
      <button class="sync-now-button" id="sync-now" type="button"><svg><use href="#i-refresh"/></svg> Sync now & verify</button>
    </section>
    <section class="autocorrect-setting" aria-label="Auto correction">
      <label for="auto-correct"><span class="settings-section-label">Writing</span><span>Auto-correct clear typos after Space</span></label>
      <input id="auto-correct" type="checkbox" />
    </section>
    <section class="appearance-setting theme-settings" aria-label="Appearance">
      <div class="theme-settings-head"><span class="settings-section-label">THEMES</span><span id="theme-mode">Dark</span></div>
      <div class="theme-grid" id="theme-grid" role="group" aria-label="Choose website theme">
        <button type="button" class="theme-tile" data-pick-theme="dark" title="Classic Dark"><span class="theme-swatch" style="--theme-bg:#111417;--theme-accent:#90b8d4"></span>Dark</button>
        <button type="button" class="theme-tile" data-pick-theme="light" title="Classic Light"><span class="theme-swatch" style="--theme-bg:#f7f9fb;--theme-accent:#527994"></span>Light</button>
        <button type="button" class="theme-tile" data-pick-theme="midnight" title="Midnight Navy"><span class="theme-swatch" style="--theme-bg:#101b2b;--theme-accent:#6ba6d9"></span>Midnight</button>
        <button type="button" class="theme-tile" data-pick-theme="sepia" title="Warm Sepia"><span class="theme-swatch" style="--theme-bg:#f4ead7;--theme-accent:#a47d56"></span>Sepia</button>
        <button type="button" class="theme-tile" data-pick-theme="nord" title="Nord Frost"><span class="theme-swatch" style="--theme-bg:#2e3440;--theme-accent:#88c0d0"></span>Nord</button>
        <button type="button" class="theme-tile" data-pick-theme="forest" title="Forest Green"><span class="theme-swatch" style="--theme-bg:#162b25;--theme-accent:#78b89a"></span>Forest</button>
        <button type="button" class="theme-tile" data-pick-theme="rose" title="Dusty Rose"><span class="theme-swatch" style="--theme-bg:#30242e;--theme-accent:#d89bb8"></span>Rose</button>
        <button type="button" class="theme-tile" data-pick-theme="solarized" title="Solarized Dark"><span class="theme-swatch" style="--theme-bg:#002b36;--theme-accent:#2aa198"></span>Solarized</button>
      </div>
    </section>
    <div class="form-grid" id="cloud-login-fields"><label>Your private Cloudflare password<input id="owner-password" type="password" placeholder="Owner password" autocomplete="current-password"/></label></div>
    <div class="modal-actions"><button class="primary" id="sign-in">Unlock cloud vault</button><button class="secondary" id="sign-out" hidden>Sign out</button></div>
    <p class="form-feedback" id="auth-feedback" role="status"></p>
    <hr class="modal-rule"/>
    <h3>Backups</h3><div class="modal-actions"><button class="secondary" id="export-all"><svg><use href="#i-download"/></svg> Export backup</button><button class="secondary" id="import-all"><svg><use href="#i-upload"/></svg> Import backup</button><input id="import-file" type="file" accept="application/json,.json" hidden /></div>
  </dialog>
  <dialog class="modal action-dialog" id="action-dialog" aria-labelledby="action-heading">
    <h2 id="action-heading">Edit</h2>
    <label class="dialog-label" for="action-input" id="action-label">Name</label>
    <input id="action-input" type="text" maxlength="200" autocomplete="off"/>
    <div class="dialog-actions"><button id="action-cancel" class="secondary">Cancel</button><button id="action-ok" class="primary">Save</button></div>
  </dialog>
  <dialog class="modal action-dialog" id="confirm-dialog" aria-labelledby="confirm-heading">
    <h2 id="confirm-heading">Confirm</h2>
    <p id="confirm-text"></p>
    <div class="dialog-actions"><button id="confirm-cancel" class="secondary">Cancel</button><button id="confirm-ok" class="danger-button">Delete</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
