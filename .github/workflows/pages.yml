name: MX Notes quality checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate client JavaScript
        run: node --check app.js
      - name: Validate Cloudflare modules
        run: |
          node --check --input-type=module < functions/api/session.js
          node --check --input-type=module < functions/api/vault.js
          node --check --input-type=module < functions/_lib/owner.js
      - name: Verify page wiring
        run: |
          python3 - <<'PY'
          import re
          html=open('index.html',encoding='utf-8').read()
          app=open('app.js',encoding='utf-8').read()
          ids=set(re.findall(r'\bid="([^"]+)"',html))
          refs=set(re.findall(r"\$\('([^']+)'\)",app))
          missing=refs-ids
          assert not missing, f'Missing HTML elements for JS IDs: {sorted(missing)}'
          assert 'id="note-tags"' not in html, 'Tags UI must be removed'
          assert 'id="open-tabs"' in html and 'id="rich-editor"' in html
          assert 'supabase' not in app.lower(), 'Supabase remains in client code'
          print('MX Notes UI wiring looks consistent')
          PY
